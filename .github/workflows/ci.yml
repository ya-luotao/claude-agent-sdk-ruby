name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Run linter
        run: bundle exec rubocop

  # Dependency resolutions the main Gemfile can't reach: its RuboCop pin holds
  # json at 2.x. `latest` forces the newest allowed majors (json 3.x, mcp 1.x);
  # `floor` pins the oldest supported runtime dependencies, on the oldest and
  # newest supported Ruby. rspec only — lint runs on the main leg. See
  # gemfiles/*.gemfile.
  deps:
    name: deps (${{ matrix.gemfile }}, Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gemfile: latest
            ruby-version: '3.4'
          - gemfile: floor
            ruby-version: '3.2'
          - gemfile: floor
            ruby-version: '3.4'
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Show resolved runtime dependencies
        run: bundle list | grep -E ' (async|mcp|json|json_schemer|io-event) '

      - name: Run tests
        run: bundle exec rspec

  # Rails integration (Railtie, rake tasks, generator, callback wrapper) on
  # the oldest supported Rails with the oldest Ruby and the newest Rails with
  # the newest Ruby. spec/rails only, in its own process: railties and
  # ActiveSupport patch core classes, so the root .rspec excludes spec/rails
  # from the main run and `--options spec/rails/.rspec` replaces it here. See
  # gemfiles/rails_*.gemfile.
  rails:
    name: rails (${{ matrix.gemfile }}, Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gemfile: rails_7_1
            ruby-version: '3.2'
          - gemfile: rails_8
            ruby-version: '3.4'
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Show resolved Rails
        run: bundle list | grep -E ' (railties|activesupport) '

      - name: Run Rails integration specs
        run: bundle exec rspec --options spec/rails/.rspec
