name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Main suite + lint on every supported Ruby (Linux). The Ruby 3.4 Linux leg
  # also collects coverage (simplecov, COVERAGE=1): the total goes to the job
  # summary and the HTML report is uploaded as an artifact. No threshold gate.
  # One macOS leg runs the suite on the newest Ruby: the transport depends on
  # signals, pipes and TERM/KILL escalation, whose behavior differs per OS.
  test:
    name: test (${{ matrix.os }}, Ruby ${{ matrix.ruby-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby-version: ['3.2', '3.3', '3.4']
        include:
          - os: ubuntu-latest
            ruby-version: '3.4'
            coverage: true
          - os: macos-latest
            ruby-version: '3.4'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec
        env:
          COVERAGE: ${{ matrix.coverage && '1' || '' }}

      - name: Coverage summary
        if: matrix.coverage
        run: |
          {
            echo "### Coverage (main suite, Ruby ${{ matrix.ruby-version }})"
            echo
            echo "| Line | Branch |"
            echo "| --- | --- |"
            echo "| $(jq -r .result.line coverage/.last_run.json)% | $(jq -r .result.branch coverage/.last_run.json)% |"
            echo
            echo "HTML report: the \`coverage-html\` artifact of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

      - name: Run linter
        if: runner.os == 'Linux'
        run: bundle exec rubocop

      # The RBS signatures in sig/ must parse and resolve (every referenced
      # type exists). Once per run: the result does not depend on the Ruby.
      - name: Validate RBS signatures
        if: runner.os == 'Linux' && matrix.ruby-version == '3.4'
        run: bundle exec rake rbs:validate

  # The suite again under rbs's runtime type checker (rake rbs:test): every
  # call into a ClaudeAgentSDK class or module with a signature in sig/ is
  # checked against it, so a signature that disagrees with the code fails
  # here. Slower than the plain run, hence its own job. Examples tagged
  # `rbs_incompatible:` (deliberately out-of-signature inputs) are skipped.
  rbs-test:
    name: rbs runtime type check (Ruby 3.4)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run tests with RBS runtime type checking
        run: bundle exec rake rbs:test

  # Dependency resolutions the main Gemfile can't reach: its RuboCop pin holds
  # json at 2.x. `latest` forces the newest allowed majors (json 3.x, mcp 1.x);
  # `floor` pins the oldest supported runtime dependencies, on the oldest and
  # newest supported Ruby. rspec only — lint runs on the main leg. See
  # gemfiles/*.gemfile.
  deps:
    name: deps (${{ matrix.gemfile }}, Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gemfile: latest
            ruby-version: '3.4'
          - gemfile: floor
            ruby-version: '3.2'
          - gemfile: floor
            ruby-version: '3.4'
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Show resolved runtime dependencies
        run: bundle list | grep -E ' (async|mcp|json|json_schemer|io-event) '

      - name: Run tests
        run: bundle exec rspec

  # Rails integration (Railtie, rake tasks, generator, callback wrapper) on
  # the oldest supported Rails with the oldest Ruby and the newest Rails with
  # the newest Ruby. spec/rails only, in its own process: railties and
  # ActiveSupport patch core classes, so the root .rspec excludes spec/rails
  # from the main run and `--options spec/rails/.rspec` replaces it here. See
  # gemfiles/rails_*.gemfile.
  rails:
    name: rails (${{ matrix.gemfile }}, Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gemfile: rails_7_1
            ruby-version: '3.2'
          - gemfile: rails_8
            ruby-version: '3.4'
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Show resolved Rails
        run: bundle list | grep -E ' (railties|activesupport) '

      - name: Run Rails integration specs
        run: bundle exec rspec --options spec/rails/.rspec
