# Real-CLI checks. Each job installs the CLI pinned by
# CLIInstaller::PINNED_CLI_VERSION (rake claude_agent_sdk:install_cli) and
# drives it from the SDK:
#
# - keyless-smoke needs no secret and runs on every trigger: the initialize
#   handshake, and a prompt the CLI cannot send for lack of credentials,
#   which must come back as a typed ResultError rather than a hang
#   (spec/integration/keyless_smoke_spec.rb). It checks the installer, the
#   transport, the control protocol, the message parser and the error path
#   against the real binary. It reaches no model.
# - real-cli runs spec/integration with live, budget-capped API calls (each
#   example sets max_budget_usd). It needs an ANTHROPIC_API_KEY repository
#   secret: the gate job checks for it, and without one real-cli shows as
#   skipped, not as passed. Fork and Dependabot PRs never receive secrets,
#   so for them it is always skipped.
#
# Triggers: weekly, on demand, and on PRs that touch the installer (which is
# where cli-pin-bump.yml moves the pin), the transport, Query or the message
# parser, so a CLI bump or a wire-protocol change meets the real binary
# before it merges. A pin-bump PR opened with the default GITHUB_TOKEN gets
# its runs only once someone approves them (see cli-pin-bump.yml).
name: Integration (real CLI)

on:
  schedule:
    # Mondays; scheduled workflows are auto-disabled after 60 days without
    # repo activity — workflow_dispatch stays available.
    - cron: '41 7 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - lib/claude_agent_sdk/cli_installer.rb
      - lib/claude_agent_sdk/subprocess_cli_transport.rb
      - lib/claude_agent_sdk/query.rb
      - lib/claude_agent_sdk/message_parser.rb
      - spec/integration/**
      - .github/workflows/integration.yml

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyless-smoke:
    name: keyless smoke (pinned CLI, no credentials, Ruby 3.4)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # As in real-cli below: the vendored binary, put on PATH.
      - name: Install pinned Claude Code CLI
        run: |
          bundle exec rake claude_agent_sdk:install_cli
          echo "$GITHUB_WORKSPACE/vendor/claude" >> "$GITHUB_PATH"

      - name: Show CLI version
        run: claude --version

      - name: Run the keyless smoke
        env:
          RUN_KEYLESS_SMOKE: '1'
        run: bundle exec rspec spec/integration/keyless_smoke_spec.rb --format json --out "$RUNNER_TEMP/keyless-smoke.json"

      # Without RUN_KEYLESS_SMOKE the spec filters its examples out, and rspec
      # passes a run that executed none. Make sure this one ran them.
      - name: Check that the smoke ran
        run: >-
          ruby -rjson -e 'summary = JSON.parse(File.read(ARGV[0])).fetch("summary");
          abort("the keyless smoke did not run its examples: #{summary}") unless
          summary["example_count"] >= 2 && summary["pending_count"].zero? && summary["failure_count"].zero?'
          "$RUNNER_TEMP/keyless-smoke.json"

  # secrets.* can't appear in an `if:`, so this job checks for the key and
  # real-cli keys off its output.
  gate:
    name: ANTHROPIC_API_KEY available
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}

    steps:
      - name: Check for ANTHROPIC_API_KEY
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=Keyed integration run skipped::The ANTHROPIC_API_KEY secret is not available (not configured, or a fork/Dependabot PR), so the real-cli job is skipped. Add it as a repository secret to enable that run; keyless-smoke runs either way."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  real-cli:
    name: real CLI (pinned version, Ruby 3.4)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # The plain-Rakefile task (Rakefile requires claude_agent_sdk/tasks),
      # i.e. CLIInstaller.install_pinned into vendor/claude. The specs look
      # the CLI up on PATH and skip without it, so put it there and fail
      # loudly here if it doesn't run.
      - name: Install pinned Claude Code CLI
        run: |
          bundle exec rake claude_agent_sdk:install_cli
          echo "$GITHUB_WORKSPACE/vendor/claude" >> "$GITHUB_PATH"

      - name: Show CLI version
        run: claude --version

      - name: Run integration specs
        env:
          RUN_INTEGRATION: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bundle exec rspec spec/integration
